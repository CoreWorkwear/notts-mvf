# Both functions do their OWN admin check (verify the caller's JWT → is_admin).
# Platform-level verify_jwt is disabled so the browser CORS preflight (which
# carries no token) reaches the function's own OPTIONS/CORS handler. An
# unauthenticated call still gets 401 from inside the function.
[functions.send-push]
verify_jwt = false

[functions.admin-create-player]
verify_jwt = false
