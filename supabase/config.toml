# The three admin functions do their OWN admin check (verify the caller's JWT → is_admin).
# Platform-level verify_jwt is disabled so the browser CORS preflight (which
# carries no token) reaches the function's own OPTIONS/CORS handler. An
# unauthenticated call still gets 401 from inside the function.
[functions.send-push]
verify_jwt = false

[functions.admin-create-player]
verify_jwt = false

[functions.admin-delete-player]
verify_jwt = false

# Fired by pg_cron (no user JWT) — gated by its own x-cron-secret check instead.
[functions.run-reminders]
verify_jwt = false

# Private training outbox worker uses the same server-only cron secret.
[functions.run-training-push]
verify_jwt = false

# Each browser function handles preflight and verifies the signed-in user
# and club permissions internally.
[functions.stripe-connect-onboard]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = false

[functions.stripe-saved-cards]
verify_jwt = false

[functions.send-account-reminders]
verify_jwt = false

[functions.stripe-payout-reconciliation]
verify_jwt = false

# Stripe sends signed requests without a Supabase JWT.
[functions.stripe-connect-webhook]
verify_jwt = false
