/* Hardware-back + scroll-lock for any bottom sheet.
   Pushing a history entry on open means the phone back button pops it (closing the sheet) instead of exiting the app. */
function useSheetBack(open,onClose){
  useEffect(()=>{
    if(!open) return;
    window.history.pushState({sheet:true},"");
    const onPop=()=>onClose();
    window.addEventListener("popstate",onPop);
    const prevOverflow=document.body.style.overflow;
    document.body.style.overflow="hidden"; // lock background scroll while sheet is up
    return ()=>{
      window.removeEventListener("popstate",onPop);
      document.body.style.overflow=prevOverflow;
      // if the sheet was closed by something other than back (e.g. Close button), tidy the history entry
      if(window.history.state&&window.history.state.sheet) window.history.back();
    };
  },[open]);
}

function fmtDate(d,fmt){
  if(!d) return "";
  const o = fmt==="long"?{weekday:"long",day:"numeric",month:"long"}:fmt==="poster"?{weekday:"short",day:"numeric",month:"short"}:{weekday:"short",day:"numeric",month:"short"};
  return new Date(d+"T12:00:00").toLocaleDateString("en-GB",o);
}
function daysUntil(s){const a=new Date();a.setHours(0,0,0,0);const b=new Date(s+"T12:00:00");b.setHours(0,0,0,0);return Math.round((b-a)/86400000);}

/* CREST */
function Crest({size=36,on="blood"}){
  const bg=on==="blood"?"var(--blood)":on==="forest"?"var(--forest)":"transparent";
  return(
    <div style={{width:size,height:size,borderRadius:"50%",background:bg,display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:`2px solid rgba(255,255,255,.9)`}}>
      <svg width={size*0.56} height={size*0.56} viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L20 5 V11 C20 16 16 20 12 22 C8 20 4 16 4 11 V5 Z" fill="#fff" opacity="0.96"/>
        <path d="M12 6 C10 6 9 7.5 9 9.5 C9 11 10 12 10 13 L14 13 C14 12 15 11 15 9.5 C15 7.5 14 6 12 6 Z" fill={bg==="transparent"?"var(--ink)":bg}/>
        <circle cx="12" cy="10" r="1.4" fill="#fff"/>
      </svg>
    </div>
  );
}

/* AUTH */
function Auth({users,setUsers,onLogin}){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState(""),[pw,setPw]=useState(""),[err,setErr]=useState("");
  const [reg,setReg]=useState({first:"",last:"",phone:"",email:"",password:"",positions:[],preferred:"",teams:["xl"]});
  function doLogin(){setErr("");const u=users.find(x=>x.email.toLowerCase()===email.trim().toLowerCase()&&x.password===pw);if(!u){setErr("Email or password not recognised.");return;}onLogin(u);}
  function togglePos(p){setReg(r=>({...r,positions:r.positions.includes(p)?r.positions.filter(x=>x!==p):[...r.positions,p]}));}
  function toggleTeam(t){setReg(r=>({...r,teams:r.teams.includes(t)?r.teams.filter(x=>x!==t):[...r.teams,t]}));}
  function doRegister(){setErr("");if(!reg.first.trim()||!reg.last.trim()||!reg.email.trim()||!reg.phone.trim()||!reg.password.trim()){setErr("First name, surname, email, phone and password are all needed.");return;}if(reg.positions.length===0){setErr("Pick at least one position.");return;}if(reg.teams.length===0){setErr("Pick at least one team.");return;}if(users.some(u=>u.email.toLowerCase()===reg.email.trim().toLowerCase())){setErr("That email's already registered.");return;}const u={id:Date.now(),first:reg.first.trim(),last:reg.last.trim(),phone:reg.phone.trim(),email:reg.email.trim(),password:reg.password,role:"player",positions:reg.positions,preferred:reg.preferred||reg.positions[0],teams:reg.teams,xlEligible:false};setUsers(p=>[...p,u]);onLogin(u);}
  return(
    <div style={{minHeight:"100vh",position:"relative",display:"flex",flexDirection:"column",justifyContent:"center",padding:"32px 20px calc(32px + var(--safe-b))",maxWidth:480,margin:"0 auto"}}>
      <div style={{position:"absolute",inset:0,background:"radial-gradient(120% 60% at 50% 0%, rgba(200,16,46,.22), transparent 70%)"}}/>
      <div style={{position:"relative",textAlign:"center",marginBottom:30}}>
        <Crest size={84}/>
        <div className="disp" style={{fontSize:44,marginTop:16}}>Nottinghamshire<br/>MvF</div>
        <div className="eyebrow" style={{marginTop:8}}>Est. 2020 · Team Hub</div>
      </div>
      <div className="surface" style={{position:"relative",padding:22,borderRadius:20}}>
        <div style={{display:"flex",gap:6,marginBottom:22,background:"var(--ink)",padding:5,borderRadius:13}}>
          {["login","register"].map(m=>(<button key={m} onClick={()=>{setMode(m);setErr("");}} style={{flex:1,padding:12,borderRadius:9,background:mode===m?"var(--blood-bright)":"transparent",color:mode===m?"#fff":"var(--bone-mute)",fontWeight:700,fontSize:14}}>{m==="login"?"Sign in":"Register"}</button>))}
        </div>
        {mode==="login"?(
          <>
            <div className="fr"><label className="fl">Email</label><input type="email" inputMode="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></div>
            <div className="fr"><label className="fl">Password</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&doLogin()}/></div>
            {err&&<div style={{color:"var(--blood-bright)",fontSize:14,marginBottom:14}}>{err}</div>}
            <button className="btn-primary" style={{width:"100%"}} onClick={doLogin}>Sign in</button>
            <div className="mono" style={{marginTop:18,padding:13,background:"var(--ink)",borderRadius:11,fontSize:12,color:"var(--bone-mute)",lineHeight:1.8}}>
              <span style={{color:"var(--bone)"}}>DEMO LOGINS</span><br/>Admin · chris@nottsmvf.test · admin<br/>Player · joe@nottsmvf.test · player
            </div>
          </>
        ):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div className="fr"><label className="fl">First name *</label><input value={reg.first} onChange={e=>setReg(r=>({...r,first:e.target.value}))}/></div>
              <div className="fr"><label className="fl">Surname *</label><input value={reg.last} onChange={e=>setReg(r=>({...r,last:e.target.value}))}/></div>
            </div>
            <div className="fr"><label className="fl">Phone *</label><input type="tel" inputMode="tel" value={reg.phone} onChange={e=>setReg(r=>({...r,phone:e.target.value}))} placeholder="07700 900000"/></div>
            <div className="fr"><label className="fl">Email *</label><input type="email" inputMode="email" value={reg.email} onChange={e=>setReg(r=>({...r,email:e.target.value}))}/></div>
            <div className="fr"><label className="fl">Password *</label><input type="password" value={reg.password} onChange={e=>setReg(r=>({...r,password:e.target.value}))}/></div>
            <div className="fr"><label className="fl">Positions you play</label><div style={{display:"flex",flexWrap:"wrap",gap:7}}>{POSITIONS.map(p=>{const on=reg.positions.includes(p);return <button key={p} onClick={()=>togglePos(p)} className="chip" style={on?{borderColor:"var(--blood-bright)",background:"var(--blood-dim2)",color:"var(--blood-bright)"}:{}}>{p}</button>;})}</div></div>
            {reg.positions.length>0&&<div className="fr"><label className="fl">Preferred position</label><select value={reg.preferred} onChange={e=>setReg(r=>({...r,preferred:e.target.value}))}><option value="">Pick one</option>{reg.positions.map(p=><option key={p}>{p}</option>)}</select></div>}
            <div className="fr"><label className="fl">Which team(s)?</label><div style={{display:"flex",gap:8}}>{Object.values(TEAMS).map(t=>{const on=reg.teams.includes(t.id);return <button key={t.id} onClick={()=>toggleTeam(t.id)} className="chip" style={on?{borderColor:t.c,background:t.dim2,color:t.c}:{}}>{t.label}</button>;})}</div><div style={{fontSize:11,color:"var(--bone-dim)",marginTop:7}}>XL 11s eligibility is confirmed by an admin after you register.</div></div>
            {err&&<div style={{color:"var(--blood-bright)",fontSize:14,marginBottom:14}}>{err}</div>}
            <button className="btn-primary" style={{width:"100%"}} onClick={doRegister}>Create account</button>
          </>
        )}
      </div>
    </div>
  );
}

/* FIXTURE FORM */

/* CALENDAR */
function CalendarView({fixtures,onOpen}){
  const today=new Date();const [ym,setYm]=useState({y:today.getFullYear(),m:today.getMonth()});
  const first=new Date(ym.y,ym.m,1);const startDow=(first.getDay()+6)%7;const daysIn=new Date(ym.y,ym.m+1,0).getDate();
  const monthLabel=first.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  const byDay={};fixtures.forEach(f=>{const d=new Date(f.date+"T12:00:00");if(d.getFullYear()===ym.y&&d.getMonth()===ym.m){(byDay[d.getDate()]=byDay[d.getDate()]||[]).push(f);}});
  function shift(n){setYm(p=>{const d=new Date(p.y,p.m+n,1);return{y:d.getFullYear(),m:d.getMonth()};});}
  const cells=[];for(let i=0;i<startDow;i++)cells.push(null);for(let d=1;d<=daysIn;d++)cells.push(d);
  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <button className="btn-ghost" style={{padding:"10px 16px"}} onClick={()=>shift(-1)}>‹</button>
        <div className="disp" style={{fontSize:26}}>{monthLabel}</div>
        <button className="btn-ghost" style={{padding:"10px 16px"}} onClick={()=>shift(1)}>›</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
        {["M","T","W","T","F","S","S"].map((d,i)=><div key={i} className="mono" style={{textAlign:"center",fontSize:11,color:"var(--bone-dim)",padding:"4px 0"}}>{d}</div>)}
        {cells.map((d,i)=>{if(!d)return <div key={i}/>;const games=byDay[d]||[];const isToday=ym.y===today.getFullYear()&&ym.m===today.getMonth()&&d===today.getDate();return(
          <div key={i} style={{minHeight:62,borderRadius:11,border:`1px solid ${isToday?"var(--blood-bright)":"var(--line)"}`,background:games.length?"var(--smoke)":"transparent",padding:6,display:"flex",flexDirection:"column",gap:3}}>
            <div className="mono" style={{fontSize:12,color:isToday?"var(--blood-bright)":"var(--bone-mute)",fontWeight:isToday?700:400}}>{d}</div>
            {games.slice(0,2).map(gm=>(<div key={gm.id} className="tap" onClick={()=>onOpen(gm)} style={{height:7,borderRadius:3,background:teamOf(gm.team).grad}}/>))}

/* FIXTURES PAGE */
function Fixtures({me,users,fixtures,setFixtures,avail,setAvail,isAdmin,season}){
  const [teamFilter,setTeamFilter]=useState("all");const [view,setView]=useState("cards");
  const [detail,setDetail]=useState(null);const [detailTab,setDetailTab]=useState("whosin");const [formOpen,setFormOpen]=useState(false);const [editFix,setEditFix]=useState(null);
  function openDetail(f,tab){setDetailTab(tab||"whosin");setDetail(f);}
  const today=new Date().toISOString().split("T")[0];
  function vis(f){if(isAdmin)return true;if(!me.teams.includes(f.team))return false;if(f.team==="xl"&&!me.xlEligible)return false;return true;}
  const visible=fixtures.filter(vis);
  const calList=visible.filter(f=>teamFilter==="all"||f.team===teamFilter);
  const list=visible.filter(f=>f.date>=today).filter(f=>teamFilter==="all"||f.team===teamFilter).sort((a,b)=>a.date.localeCompare(b.date)||a.kickoff.localeCompare(b.kickoff));
  function countIn(fid){return Object.values(avail[String(fid)]||{}).filter(v=>v==="in").length;}
  function countsFor(fid){const fa=avail[String(fid)]||{};const v=Object.values(fa);return{in:v.filter(x=>x==="in").length,maybe:v.filter(x=>x==="maybe").length,out:v.filter(x=>x==="out").length};}
  function saveFix(form){if(editFix){setFixtures(p=>p.map(x=>x.id===editFix.id?{...x,...form}:x));if(detail)setDetail(d=>({...d,...form}));}else setFixtures(p=>[...p,{...form,id:Date.now()}]);setFormOpen(false);setEditFix(null);}
  const [hero,...rest]=list;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <div className="disp" style={{fontSize:40}}>Fixtures</div>
        {isAdmin&&<button className="btn-primary" style={{padding:"12px 18px"}} onClick={()=>{setEditFix(null);setFormOpen(true);}}>+ Add</button>}
      </div>
      <div style={{display:"flex",gap:9,marginBottom:20}}>
        <div style={{display:"flex",gap:5,background:"var(--smoke)",padding:5,borderRadius:13,flex:1,border:"1px solid var(--line)"}}>
          {[["cards","List"],["calendar","Calendar"]].map(([k,l])=>(<button key={k} onClick={()=>setView(k)} style={{flex:1,padding:"10px",borderRadius:9,background:view===k?"var(--blood-bright)":"transparent",color:view===k?"#fff":"var(--bone-mute)",fontSize:13,fontWeight:700}}>{l}</button>))}
        </div>
        {(isAdmin||(me.teams.includes("xl")&&me.xlEligible&&me.teams.includes("community")))&&(
          <select style={{width:"auto",flex:1}} value={teamFilter} onChange={e=>setTeamFilter(e.target.value)}><option value="all">Both teams</option><option value="xl">XL 11s</option><option value="community">Community</option></select>
        )}
      </div>
      {view==="calendar"
        ?<CalendarView fixtures={calList} onOpen={f=>openDetail(f)}/>
        :(list.length===0
          ?<div className="surface" style={{textAlign:"center",padding:"36px 24px",color:"var(--bone-mute)"}}>
            <div style={{fontSize:30,marginBottom:10}}>📭</div>
            <div style={{fontSize:15,color:"var(--bone)",fontWeight:600,marginBottom:6}}>{isAdmin?"No upcoming fixtures":"Nothing in the diary yet"}</div>
            <div style={{fontSize:13,lineHeight:1.5}}>{isAdmin?"Add a fixture and it'll show here for the squad.":`New games for your team${me.teams.includes("xl")&&!me.xlEligible?" (and any XL games once you're signed off)":""} will appear here. Check back, or give the gaffer a nudge.`}</div>
          </div>
          :<>
            {hero&&<HeroPoster fix={hero} countIn={countIn(hero.id)} counts={countsFor(hero.id)} myStatus={(avail[String(hero.id)]||{})[String(me.id)]} setMyStatus={v=>setAvail(p=>({...p,[String(hero.id)]:{...p[String(hero.id)],[String(me.id)]:v}}))} isAdmin={isAdmin} onOpen={openDetail}/>}
            {rest.length>0&&<div className="eyebrow" style={{marginBottom:12}}>Coming up after</div>}
            <div style={{display:"flex",flexDirection:"column",gap:11}}>{rest.map(f=><FixtureStrip key={f.id} fix={f} counts={countsFor(f.id)} onOpen={openDetail}/>)}</div>
          </>
        )
      }
      {detail&&<FixtureDetail fix={detail} initialTab={detailTab} me={me} users={users} avail={avail} setAvail={setAvail} isAdmin={isAdmin} onClose={()=>setDetail(null)} onEdit={f=>{setDetail(null);setTimeout(()=>{setEditFix(f);setFormOpen(true);},60);}}/>}
      {formOpen&&<FixtureForm initial={editFix} season={season} onSave={saveFix} onClose={()=>{setFormOpen(false);setEditFix(null);}}/>}
    </div>
  );

/* ADMIN PLAYERS */
function AdminPlayers({me,users,setUsers}){
  const [q,setQ]=useState("");const [editId,setEditId]=useState(null);const [form,setForm]=useState(null);const [isNew,setIsNew]=useState(false);const [err,setErr]=useState("");
  const blank={first:"",last:"",phone:"",email:"",password:"",role:"player",positions:[],preferred:"",teams:["xl"],xlEligible:false,active:true,dob:"",ecName:"",ecPhone:""};
  function openEdit(u){setForm({...u,positions:[...u.positions],teams:[...u.teams]});setEditId(u.id);setIsNew(false);}
  function openAdd(){setForm({...blank,id:Date.now()});setEditId(null);setIsNew(true);}
  function togglePos(p){setForm(f=>({...f,positions:f.positions.includes(p)?f.positions.filter(x=>x!==p):[...f.positions,p]}));}
  function toggleTeam(t){setForm(f=>({...f,teams:f.teams.includes(t)?f.teams.filter(x=>x!==t):[...f.teams,t]}));}
  function close(){setEditId(null);setForm(null);setIsNew(false);setErr("");}
  function save(){
    setErr("");
    if(!form.first.trim()||!form.last.trim()||!form.email.trim()||!form.phone.trim()){setErr("First name, surname, email and phone are all required.");return;}
    if(isNew&&users.some(u=>u.email.toLowerCase()===form.email.trim().toLowerCase())){setErr("That email's already registered.");return;}
    const clean={...form,first:form.first.trim(),last:form.last.trim(),email:form.email.trim(),phone:form.phone.trim(),preferred:form.positions.includes(form.preferred)?form.preferred:form.positions[0]};
    if(isNew) setUsers(p=>[...p,clean]);
    else setUsers(p=>p.map(u=>u.id===editId?{...u,...clean}:u));
    close();
  }
  function toggleActive(){setForm(f=>({...f,active:f.active===false?true:false}));}

  const matched=users.filter(u=>(u.first+" "+u.last+" "+u.email).toLowerCase().includes(q.toLowerCase()));
  const activeList=matched.filter(u=>u.active!==false).sort((a,b)=>a.first.localeCompare(b.first));
  const inactiveList=matched.filter(u=>u.active===false).sort((a,b)=>a.first.localeCompare(b.first));

  function Row({u}){
    const t=u.teams.includes("xl")?TEAMS.xl:TEAMS.community;
    return(
      <div className="tap" onClick={()=>openEdit(u)} style={{display:"flex",borderRadius:14,overflow:"hidden",background:"var(--smoke)",border:"1px solid var(--line)",opacity:u.active===false?.6:1}}>
        <div style={{width:6,background:t.grad,flexShrink:0}}/>
        <div style={{padding:"13px 15px",flex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
            <div><div style={{fontWeight:700,fontSize:16}}>{u.first} {u.last}</div><div className="mono" style={{fontSize:12,color:"var(--bone-mute)",marginTop:3}}>{u.phone||"no phone"}</div></div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap",justifyContent:"flex-end"}}>{u.teams.map(tm=><span key={tm} className={`badge ${teamOf(tm).badge}`}>{teamOf(tm).short}</span>)}{u.role==="admin"&&<span className="badge b-mute">Admin</span>}{u.active===false&&<span className="badge b-warn">Inactive</span>}</div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:11,paddingTop:11,borderTop:"1px solid var(--line)"}}>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{u.positions.map(p=><span key={p} className={`badge ${p===u.preferred?"b-blood":"b-mute"}`}>{p}</span>)}</div>
            <span className={`badge ${u.xlEligible?"b-blood":"b-mute"}`}>{u.xlEligible?"XL ✓":"XL ✗"}</span>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <div className="disp" style={{fontSize:40}}>Players</div>
        <button className="btn-primary" style={{padding:"12px 18px"}} onClick={openAdd}>+ Add</button>
      </div>
      <div className="mono" style={{fontSize:12,color:"var(--bone-mute)",marginBottom:16}}>{activeList.length} ACTIVE · {users.filter(u=>u.xlEligible&&u.active!==false).length} XL · {users.filter(u=>u.role==="admin").length} ADMINS</div>
      <input style={{marginBottom:16}} placeholder="Search name or email" value={q} onChange={e=>setQ(e.target.value)}/>
      <div style={{display:"flex",flexDirection:"column",gap:11}}>
        {activeList.map(u=><Row key={u.id} u={u}/>)}
      </div>
      {inactiveList.length>0&&(
        <div style={{marginTop:24}}>
          <div className="eyebrow" style={{marginBottom:12}}>Inactive · kept for history</div>
          <div style={{display:"flex",flexDirection:"column",gap:11}}>{inactiveList.map(u=><Row key={u.id} u={u}/>)}</div>
        </div>
      )}
      {form&&<PlayerEditSheet me={me} form={form} setForm={setForm} togglePos={togglePos} toggleTeam={toggleTeam} toggleActive={toggleActive} onSave={save} onClose={close} isNew={isNew} err={err}/>}
    </div>
  );
}

function PlayerEditSheet({me,form,setForm,togglePos,toggleTeam,toggleActive,onSave,onClose,isNew,err}){

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>

          <div className="fr"><label className="fl">Surname *</label><input value={form.last} onChange={e=>setForm(f=>({...f,last:e.target.value}))}/></div>

        <div className="fr">
          <label className="fl">Emergency contact</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <input placeholder="Name" value={form.ecName||""} onChange={e=>setForm(f=>({...f,ecName:e.target.value}))}/>
            <input type="tel" placeholder="Phone" value={form.ecPhone||""} onChange={e=>setForm(f=>({...f,ecPhone:e.target.value}))}/>

        <div className="fr"><label className="fl">Positions</label><div style={{display:"flex",flexWrap:"wrap",gap:7}}>{POSITIONS.map(p=>{const on=form.positions.includes(p);return <button key={p} onClick={()=>togglePos(p)} className="chip" style={on?{borderColor:"var(--blood-bright)",background:"var(--blood-dim2)",color:"var(--blood-bright)"}:{}}>{p}</button>;})}</div></div>
        {form.positions.length>0&&<div className="fr"><label className="fl">Preferred</label><select value={form.preferred} onChange={e=>setForm(f=>({...f,preferred:e.target.value}))}>{form.positions.map(p=><option key={p}>{p}</option>)}</select></div>}

        <div className="fr"><label className="fl">Role</label><div style={{display:"flex",gap:8}}>{["player","admin"].map(r=>{const on=form.role===r;const blocked=isSelf&&r==="player";return <button key={r} disabled={blocked} onClick={()=>setForm(f=>({...f,role:r}))} className="chip" style={{...(on?{borderColor:"var(--bone)",background:"rgba(244,238,234,.1)",color:"var(--bone)",fontWeight:700}:{}),...(blocked?{opacity:.4}:{})}}>{r==="admin"?"Admin":"Player"}</button>;})}</div><div style={{fontSize:11,color:"var(--bone-dim)",marginTop:7}}>Only admins create admins. You can't demote yourself.</div></div>

        {/* password */}
        {isNew?(
          <div className="fr"><label className="fl">Temporary password</label><input value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))} placeholder="Set a starter password"/><div style={{fontSize:11,color:"var(--bone-dim)",marginTop:5}}>Hand this to the player so they can sign in. They change it after.</div></div>
        ):(

            </div>

        <div style={{display:"flex",gap:9,marginTop:8}}><button className="btn-ghost" style={{flex:1}} onClick={onClose}>Cancel</button><button className="btn-primary" style={{flex:1}} onClick={onSave}>{isNew?"Add player":"Save changes"}</button></div>
      </div>
    </div>
  );
}

/* ADMIN AVAIL */
function AdminAvail({users,fixtures,avail,onOpen}){
  const today=new Date().toISOString().split("T")[0];
  const upcoming=fixtures.filter(f=>f.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  if(!upcoming.length)return <div className="surface" style={{padding:36,textAlign:"center",color:"var(--bone-mute)"}}>No upcoming fixtures to track.</div>;
  return(
    <div>
      <div className="disp" style={{fontSize:40,marginBottom:6}}>Who's In</div>
      <div className="mono" style={{fontSize:12,color:"var(--bone-mute)",marginBottom:16}}>TAP A FIXTURE FOR THE FULL LIST</div>
      <div style={{display:"flex",flexDirection:"column",gap:11}}>
        {upcoming.map(f=>{const t=teamOf(f.team);const eligible=users.filter(u=>u.active!==false&&u.teams.includes(f.team)&&(f.team!=="xl"||u.xlEligible));const fa=avail[String(f.id)]||{};const ins=eligible.filter(u=>fa[String(u.id)]==="in").length;const maybes=eligible.filter(u=>fa[String(u.id)]==="maybe").length;const outs=eligible.filter(u=>fa[String(u.id)]==="out").length;const none=eligible.length-ins-maybes-outs;return(
          <div key={f.id} className="tap" onClick={()=>onOpen(f)} style={{display:"flex",borderRadius:14,overflow:"hidden",background:"var(--smoke)",border:"1px solid var(--line)"}}>

/* ============ STATS ENGINE ============ */
/* Builds per-player tallies from results, split league vs friendly, filtered by season + team. */
function buildStats({users,fixtures,results,avail,season,teamFilter}){
  const fxById={};fixtures.forEach(f=>{fxById[String(f.id)]=f;});
  // init player rows
  const rows={};
  users.forEach(u=>{rows[`${u.first} ${u.last}`]={name:`${u.first} ${u.last}`,id:u.id,active:u.active!==false,
    apps:{l:0,f:0},goals:{l:0,f:0},assists:{l:0,f:0},motm:{l:0,f:0},w:0,d:0,ls:0,form:[]};});
  function ensure(name){if(!rows[name])rows[name]={name,id:null,active:true,apps:{l:0,f:0},goals:{l:0,f:0},assists:{l:0,f:0},motm:{l:0,f:0},w:0,d:0,ls:0,form:[]};return rows[name];}

  Object.entries(results).forEach(([fid,r])=>{
    const fx=fxById[fid];if(!fx)return;
    if(season&&fx.season!==season)return;
    if(teamFilter&&teamFilter!=="all"&&fx.team!==teamFilter)return;
    const isLeague=fx.type==="League";const k=isLeague?"l":"f";
    const res=r.us>r.them?"W":r.us<r.them?"L":"D";
    // appearances: anyone marked 'in' for that fixture
    const fa=avail[fid]||{};
    users.forEach(u=>{if(fa[String(u.id)]==="in"){const row=ensure(`${u.first} ${u.last}`);row.apps[k]++;if(isLeague){if(res==="W")row.w++;else if(res==="D")row.d++;else row.ls++;row.form.push(res);}}});
    // goals + assists
    r.goals.forEach(g=>{if(g.scorer){ensure(g.scorer).goals[k]++;}if(g.assist){ensure(g.assist).assists[k]++;}});
    // motm
    if(r.motm){ensure(r.motm).motm[k]++;}
  });
  return Object.values(rows);
}
const tot=o=>o.l+o.f;

function StatLeader({label,rows,pick,color}){
  const ranked=[...rows].filter(r=>pick(r)>0).sort((a,b)=>pick(b)-pick(a)).slice(0,5);
  if(!ranked.length) return null;
  const top=pick(ranked[0]);
  return(
    <div className="surface" style={{padding:16,marginBottom:14}}>
      <div className="eyebrow" style={{marginBottom:12}}>{label}</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {ranked.map((r,i)=>(
          <div key={r.name} style={{display:"flex",alignItems:"center",gap:12}}>
            <span className="disp" style={{fontSize:18,width:20,color:i===0?color:"var(--bone-dim)"}}>{i+1}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
              <div style={{height:5,borderRadius:3,background:"var(--ink)",marginTop:5,overflow:"hidden"}}><div style={{height:"100%",width:`${(pick(r)/top)*100}%`,background:color,borderRadius:3}}/></div>
            </div>
            <span className="disp" style={{fontSize:22,color:color}}>{pick(r)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* GOLDEN BOOT — top scorer, with crown, for the bragging rights */
function GoldenBoot({rows,scopeLabel}){
  const ranked=[...rows].filter(r=>tot(r.goals)>0).sort((a,b)=>tot(b.goals)-tot(a.goals));
  if(!ranked.length) return null;
  const top=ranked[0];const topN=tot(top.goals);
  const joint=ranked.filter(r=>tot(r.goals)===topN);
  return(
    <div style={{position:"relative",borderRadius:18,overflow:"hidden",marginBottom:18,background:"linear-gradient(135deg,#e8b53f 0%,#9a7415 100%)",padding:"18px 18px"}}>
      <div className="motif"/>
      <div style={{position:"relative"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div className="eyebrow" style={{color:"rgba(0,0,0,.7)"}}>{scopeLabel} Golden Boot</div>
          <span style={{fontSize:22}}>👑</span>
        </div>
        {joint.length===1
          ?<div className="disp" style={{fontSize:"clamp(30px,9vw,42px)",color:"#1a1206",lineHeight:.95}}>{top.name}</div>
          :<div className="disp" style={{fontSize:"clamp(24px,7vw,32px)",color:"#1a1206",lineHeight:1}}>{joint.map(r=>r.name).join(" · ")}</div>
        }
        <div style={{display:"flex",alignItems:"baseline",gap:8,marginTop:8}}>
          <span className="disp" style={{fontSize:36,color:"#1a1206"}}>{topN}</span>
          <span className="mono" style={{fontSize:12,color:"rgba(0,0,0,.7)"}}>GOALS · {top.goals.l}L · {top.goals.f}F{joint.length>1?` · ${joint.length} TIED`:""}</span>
        </div>
      </div>
    </div>
  );
}

/* CLUB STATS PAGE */
function Stats({users,fixtures,results,avail,season}){
  const [teamFilter,setTeamFilter]=useState("all");
  const rows=buildStats({users,fixtures,results,avail,season,teamFilter});
  const [sortKey,setSortKey]=useState("goals");
  const sorters={goals:r=>tot(r.goals),assists:r=>tot(r.assists),apps:r=>tot(r.apps),motm:r=>tot(r.motm)};
  const table=[...rows].filter(r=>tot(r.apps)>0||tot(r.goals)>0||tot(r.assists)>0).sort((a,b)=>sorters[sortKey](b)-sorters[sortKey](a));
  const scopeLabel=teamFilter==="all"?"Club":teamFilter==="xl"?"XL 11s":"Community";
  const scopeNote=teamFilter==="all"?"WHOLE CLUB · BOTH TEAMS COMBINED":teamFilter==="xl"?"XL 11S (FIRST TEAM)":"COMMUNITY (RESERVES)";

  return(
    <div>
      <div className="disp" style={{fontSize:40,marginBottom:4}}>{teamFilter==="all"?"Club Stats":scopeLabel+" Stats"}</div>
      <div className="mono" style={{fontSize:12,color:"var(--bone-mute)",marginBottom:16}}>{season} · {scopeNote}</div>

      {/* team cut: Club / XL / Community */}
      <div style={{display:"flex",gap:5,background:"var(--smoke)",padding:5,borderRadius:13,border:"1px solid var(--line)",marginBottom:20}}>
        {[["all","Whole Club"],["xl","XL 11s"],["community","Community"]].map(([k,l])=>{
          const on=teamFilter===k;
          const col=k==="xl"?"var(--blood-bright)":k==="community"?"var(--forest-bright)":"var(--bone)";
          return <button key={k} onClick={()=>setTeamFilter(k)} style={{flex:1,padding:"10px 4px",borderRadius:9,background:on?(k==="community"?"var(--forest-bright)":k==="xl"?"var(--blood-bright)":"var(--line2)"):"transparent",color:on?(k==="all"?"var(--bone)":"#fff"):"var(--bone-mute)",fontSize:12.5,fontWeight:700}}>{l}</button>;
        })}
      </div>

      {/* golden boot — club one always, per-team when filtered */}
      <GoldenBoot rows={rows} scopeLabel={scopeLabel}/>

      {/* leaderboards */}
      <StatLeader label="Top scorers" rows={rows} pick={r=>tot(r.goals)} color="var(--blood-bright)"/>
      <StatLeader label="Most assists" rows={rows} pick={r=>tot(r.assists)} color="var(--forest-bright)"/>
      <StatLeader label="Most appearances" rows={rows} pick={r=>tot(r.apps)} color="var(--info)"/>
      <StatLeader label="Man of the match" rows={rows} pick={r=>tot(r.motm)} color="var(--gold)"/>

      {/* full FM-style table */}
      <div className="eyebrow" style={{margin:"22px 0 12px"}}>Full squad stats</div>
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        {[["goals","Goals"],["assists","Assists"],["apps","Apps"],["motm","MOTM"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSortKey(k)} className="chip" style={{padding:"7px 13px",...(sortKey===k?{borderColor:"var(--blood-bright)",background:"var(--blood-dim2)",color:"var(--blood-bright)",fontWeight:700}:{})}}>{l}</button>
        ))}
      </div>
      {table.length===0
        ?<div className="surface" style={{padding:32,textAlign:"center",color:"var(--bone-mute)"}}>No stats yet this season.</div>
        :<div className="surface" style={{padding:0,overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"1.6fr repeat(4,1fr)",padding:"11px 14px",borderBottom:"1px solid var(--line)",background:"var(--ink)"}}>
            {["Player","Apps","Gls","Ast","MOTM"].map((h,i)=><div key={h} className="mono" style={{fontSize:10,color:"var(--bone-dim)",letterSpacing:".06em",textAlign:i===0?"left":"center"}}>{h.toUpperCase()}</div>)}
          </div>
          {table.map(r=>(
            <div key={r.name} style={{display:"grid",gridTemplateColumns:"1.6fr repeat(4,1fr)",padding:"11px 14px",borderBottom:"1px solid var(--line)",alignItems:"center"}}>
              <div style={{minWidth:0}}><div style={{fontSize:14,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}{!r.active&&<span className="mono" style={{fontSize:9,color:"var(--bone-dim)",marginLeft:5}}>·INACT</span>}</div></div>
              {[r.apps,r.goals,r.assists,r.motm].map((v,i)=>(
                <div key={i} style={{textAlign:"center"}}>
                  <div className="disp" style={{fontSize:18}}>{tot(v)}</div>
                  <div className="mono" style={{fontSize:9,color:"var(--bone-dim)"}}>{v.l}L · {v.f}F</div>
                </div>
              ))}
            </div>
          ))}
        </div>
      }
      <div style={{fontSize:11,color:"var(--bone-dim)",marginTop:12,lineHeight:1.5}}>L = league · F = friendly. Appearances count anyone marked available for a played fixture. Stats build automatically from results.</div>
    </div>
  );
}

/* LEAGUE TABLE PAGE */
function LeagueTable({tables,setTables,season,isAdmin}){
  const [teamView,setTeamView]=useState("xl");
  const [editing,setEditing]=useState(false);
  const seasonTables=tables[season]||{};
  const rows=(seasonTables[teamView]||[]).map(r=>({...r,gd:r.gf-r.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
  const leagueName=LEAGUES[teamView];

  function setCell(idx,key,val){
    setTables(p=>{const s={...(p[season]||{})};const arr=[...(s[teamView]||[])];arr[idx]={...arr[idx],[key]:key==="name"?val:(parseInt(val)||0)};s[teamView]=arr;return{...p,[season]:s};});
  }
  function addRow(){setTables(p=>{const s={...(p[season]||{})};const arr=[...(s[teamView]||[]),{name:"New team",p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}];s[teamView]=arr;return{...p,[season]:s};});}
  function delRow(idx){setTables(p=>{const s={...(p[season]||{})};const arr=(s[teamView]||[]).filter((_,j)=>j!==idx);s[teamView]=arr;return{...p,[season]:s};});}

  return(
    <div>
      <div className="disp" style={{fontSize:40,marginBottom:4}}>League Table</div>
      <div className="mono" style={{fontSize:12,color:"var(--bone-mute)",marginBottom:16}}>{season} · {leagueName.toUpperCase()}</div>
      <div style={{display:"flex",gap:5,background:"var(--smoke)",padding:5,borderRadius:13,border:"1px solid var(--line)",marginBottom:18}}>
        {Object.values(TEAMS).map(t=>(<button key={t.id} onClick={()=>setTeamView(t.id)} style={{flex:1,padding:"10px",borderRadius:9,background:teamView===t.id?t.c:"transparent",color:teamView===t.id?"#fff":"var(--bone-mute)",fontSize:13,fontWeight:700}}>{t.label}</button>))}
      </div>

      {isAdmin&&(
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <button className="btn-ghost" style={{flex:1}} onClick={()=>setEditing(e=>!e)}>{editing?"Done editing":"Edit table"}</button>
          {editing&&<button className="btn-ghost" onClick={addRow}>+ Row</button>}
        </div>
      )}

      {rows.length===0
        ?<div className="surface" style={{padding:32,textAlign:"center",color:"var(--bone-mute)"}}>No table for this team yet. {isAdmin&&"Tap Edit table to add it."}</div>
        :<div className="surface" style={{padding:0,overflow:"hidden",overflowX:"auto"}}>
          <div style={{minWidth:editing?560:340}}>
            <div style={{display:"grid",gridTemplateColumns:editing?"24px 2fr repeat(7,1fr) 30px":"24px 2fr repeat(4,1fr)",padding:"10px 12px",borderBottom:"1px solid var(--line)",background:"var(--ink)",gap:4}}>
              {(editing?["#","Team","P","W","D","L","GF","GA","Pts",""]:["#","Team","P","GD","Pts","Form"]).map((h,i)=><div key={i} className="mono" style={{fontSize:10,color:"var(--bone-dim)",textAlign:i<2?"left":"center"}}>{h}</div>)}
            </div>
            {rows.map((r,i)=>{
              const us=r.name.toLowerCase().includes("nottingham");
              if(editing){
                const realIdx=(seasonTables[teamView]||[]).findIndex(x=>x.name===r.name);
                return(
                  <div key={i} style={{display:"grid",gridTemplateColumns:"24px 2fr repeat(7,1fr) 30px",padding:"7px 12px",borderBottom:"1px solid var(--line)",gap:4,alignItems:"center"}}>
                    <div className="mono" style={{fontSize:12,color:"var(--bone-dim)"}}>{i+1}</div>
                    <input value={r.name} onChange={e=>setCell(realIdx,"name",e.target.value)} style={{padding:"6px 8px",fontSize:13}}/>
                    {["p","w","d","l","gf","ga","pts"].map(k=><input key={k} type="number" inputMode="numeric" value={r[k]} onChange={e=>setCell(realIdx,k,e.target.value)} style={{padding:"6px 4px",fontSize:13,textAlign:"center"}}/>)}
                    <button onClick={()=>delRow(realIdx)} style={{background:"transparent",color:"var(--blood-bright)",fontSize:16,padding:0}}>×</button>
                  </div>
                );
              }
              return(
                <div key={i} style={{display:"grid",gridTemplateColumns:"24px 2fr repeat(4,1fr)",padding:"11px 12px",borderBottom:"1px solid var(--line)",gap:4,alignItems:"center",background:us?"var(--blood-dim)":"transparent"}}>
                  <div className="disp" style={{fontSize:16,color:i<3?"var(--forest-bright)":"var(--bone-mute)"}}>{i+1}</div>
                  <div style={{fontSize:14,fontWeight:us?700:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:us?"var(--blood-bright)":"var(--bone)"}}>{r.name}</div>
                  <div className="mono" style={{fontSize:13,textAlign:"center",color:"var(--bone-mute)"}}>{r.p}</div>
                  <div className="mono" style={{fontSize:13,textAlign:"center",color:"var(--bone-mute)"}}>{r.gd>0?"+":""}{r.gd}</div>
                  <div className="disp" style={{fontSize:18,textAlign:"center"}}>{r.pts}</div>
                  <div style={{textAlign:"center"}}><span className="mono" style={{fontSize:10,color:"var(--bone-dim)"}}>{r.w}-{r.d}-{r.l}</span></div>
                </div>
              );
            })}
          </div>
        </div>
      }
      <div style={{fontSize:11,color:"var(--bone-dim)",marginTop:12,lineHeight:1.5}}>Table is kept up to date by an admin from the league's own standings. {isAdmin?"Scroll the edit grid sideways for all columns.":""}</div>
    </div>
  );
}

/* CLUB PAGE — combines stats + table under one tab */
function Club({users,fixtures,results,avail,tables,setTables,season,isAdmin}){
  const [sub,setSub]=useState("table");
  return(
    <div>
      <div style={{display:"flex",gap:5,background:"var(--smoke)",padding:5,borderRadius:13,border:"1px solid var(--line)",marginBottom:22}}>
        {[["table","League Table"],["stats","Club Stats"]].map(([k,l])=>(<button key={k} onClick={()=>setSub(k)} style={{flex:1,padding:"11px",borderRadius:9,background:sub===k?"var(--blood-bright)":"transparent",color:sub===k?"#fff":"var(--bone-mute)",fontSize:13,fontWeight:700}}>{l}</button>))}
      </div>
      {sub==="table"
        ?<LeagueTable tables={tables} setTables={setTables} season={season} isAdmin={isAdmin}/>
        :<Stats users={users} fixtures={fixtures} results={results} avail={avail} season={season}/>}
    </div>
  );
}

/* ROOT */
function App(){
  const [users,setUsers]=useState(SEED_USERS);const [fixtures,setFixtures]=useState(SEED_FIXTURES);const [avail,setAvail]=useState(SEED_AVAIL);const [results,setResults]=useState(SEED_RESULTS);const [tables,setTables]=useState(SEED_TABLES);
  const [season,setSeason]=useState(CURRENT_SEASON);
  const [meId,setMeId]=useState(null);const [tab,setTab]=useState("fixtures");const [availDetail,setAvailDetail]=useState(null);
  const me=users.find(u=>u.id===meId)||null;const isAdmin=me?.role==="admin";
  if(!me)return <Auth users={users} setUsers={setUsers} onLogin={u=>{setMeId(u.id);setTab("fixtures");}}/>;
  // fixtures filtered to selected season for the content pages
  const seasonFixtures=fixtures.filter(f=>(f.season||CURRENT_SEASON)===season);
  const resultsTab={id:"results",l:"Results",i:"M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"};
  const clubTab={id:"club",l:"Club",i:"M3 21h18M5 21V7l8-4v18M19 21V11l-6-3M9 9v.01M9 12v.01M9 15v.01"};
  const TABS=isAdmin
    ?[{id:"fixtures",l:"Fixtures",i:"M4 5h16M4 12h16M4 19h10"},resultsTab,clubTab,{id:"availability",l:"Who's In",i:"M5 13l4 4L19 7"},{id:"players",l:"Players",i:"M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 100-8 4 4 0 000 8z"},{id:"profile",l:"You",i:"M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"}]
    :[{id:"fixtures",l:"Fixtures",i:"M4 5h16M4 12h16M4 19h10"},resultsTab,clubTab,{id:"profile",l:"You",i:"M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"}];
  return(
    <div style={{minHeight:"100vh",paddingBottom:"calc(96px + var(--safe-b))"}}>
      <div className="grain"/>
      <header style={{background:"rgba(12,15,13,.85)",backdropFilter:"blur(12px)",borderBottom:"1px solid var(--line)",position:"sticky",top:0,zIndex:100,paddingTop:"var(--safe-t)"}}>
        <div style={{maxWidth:780,margin:"0 auto",padding:"0 18px",display:"flex",alignItems:"center",height:58,gap:10}}>
          <Crest size={34}/>
          <div className="disp" style={{fontSize:20,flex:1}}>Notts MvF</div>
          <select value={season} onChange={e=>setSeason(e.target.value)} style={{width:"auto",padding:"7px 10px",fontSize:13,background:"var(--smoke)"}}>{SEASONS.map(s=><option key={s}>{s}</option>)}</select>
          <button className="btn-ghost" style={{fontSize:12,padding:"8px 12px"}} onClick={()=>{if(confirm("Sign out?"))setMeId(null);}}>Out</button>
        </div>
      </header>
      <main style={{maxWidth:780,margin:"0 auto",padding:"22px 18px"}}>
        {tab==="fixtures"&&<Fixtures me={me} users={users} fixtures={seasonFixtures} setFixtures={setFixtures} avail={avail} setAvail={setAvail} isAdmin={isAdmin} season={season}/>}
        {tab==="results"&&<Results me={me} users={users} fixtures={seasonFixtures} results={results} avail={avail} setResults={setResults} isAdmin={isAdmin}/>}
        {tab==="club"&&<Club users={users} fixtures={fixtures} results={results} avail={avail} tables={tables} setTables={setTables} season={season} isAdmin={isAdmin}/>}
        {tab==="availability"&&isAdmin&&<AdminAvail users={users} fixtures={seasonFixtures} avail={avail} onOpen={f=>setAvailDetail(f)}/>}
        {tab==="players"&&isAdmin&&<AdminPlayers me={me} users={users} setUsers={setUsers}/>}
        {tab==="profile"&&<Profile me={me} setUsers={setUsers}/>}
      </main>
      {availDetail&&<FixtureDetail fix={availDetail} me={me} users={users} avail={avail} setAvail={setAvail} isAdmin={isAdmin} onClose={()=>setAvailDetail(null)} onEdit={()=>setAvailDetail(null)}/>}
      <nav style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(12,15,13,.92)",backdropFilter:"blur(12px)",borderTop:"1px solid var(--line)",zIndex:100,paddingBottom:"var(--safe-b)"}}>
        <div style={{maxWidth:780,margin:"0 auto",display:"flex"}}>
          {TABS.map(t=>{const on=tab===t.id;return(<button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,minWidth:0,background:"transparent",border:"none",padding:"11px 2px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:on?"var(--blood-bright)":"var(--bone-dim)"}}>
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={t.i}/></svg>
            <span className="mono" style={{fontSize:9.5,fontWeight:on?700:500,letterSpacing:".02em",whiteSpace:"nowrap"}}>{t.l}</span>
          </button>);})}
        </div>
      </nav>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
