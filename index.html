<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F0E9" />
    <meta name="color-scheme" content="light dark" />
    <!-- Resolve the same saved preference as ThemeProvider before CSS or PWA chrome paints. -->
    <script>
      (function () {
        var saved
        try { saved = localStorage.getItem('theme') } catch (e) {}
        var ground = saved === 'dark' || saved === 'light' ? saved :
          matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.ground = ground
        document.querySelector('meta[name="theme-color"]').content = ground === 'dark' ? '#141A12' : '#F2F0E9'
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notts MvF" />
    <title>Notts MvF</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
