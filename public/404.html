<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — Notts MvF</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0c0f0d; color: #F2F0EC; font-family: system-ui, sans-serif; }
      p { color: #9aa39c; }
      a { color: #FF3340; }
    </style>
  </head>
  <body>
    <!-- Served (with a real 404 status) for requests under /assets/ that don't
         exist — see public/_redirects. Without this rule the SPA catch-all
         answered a missing hashed chunk with index.html + the 1-year immutable
         Cache-Control from /assets/*, poisoning that URL in the browser cache. -->
    <main style="text-align: center;">
      <h1>Nothing at this address</h1>
      <p>That file isn't here any more. <a href="/">Back to the app</a>.</p>
    </main>
  </body>
</html>
